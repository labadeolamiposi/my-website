<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1350" viewBox="0 0 900 1350" role="img" aria-labelledby="title desc">
  <title id="title">Framed landscape art sample</title>
  <desc id="desc">A framed landscape illustration on a warm cream wall with a small leafy plant below.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7ddca"/>
      <stop offset="1" stop-color="#c9bba2"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#79502f"/>
      <stop offset="0.45" stop-color="#c0935d"/>
      <stop offset="1" stop-color="#5d3923"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7a66e"/>
      <stop offset="1" stop-color="#f2d3a2"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="20"/>
      <feOffset dx="12" dy="25" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="1350" fill="url(#wall)"/>
  <path d="M0 1030h900v320H0z" fill="#b8a78c"/>
  <path d="M0 1030h900" stroke="#aa987c" stroke-width="8"/>
  <g filter="url(#shadow)">
    <rect x="172" y="145" width="556" height="734" rx="5" fill="url(#frame)"/>
    <rect x="199" y="172" width="502" height="680" fill="#eee5d4"/>
    <rect x="226" y="199" width="448" height="626" fill="#f7f0e4"/>
    <rect x="249" y="222" width="402" height="580" fill="url(#sky)"/>
    <circle cx="536" cy="347" r="62" fill="#fff0bb"/>
    <path d="M249 551 390 378l112 142 69-87 80 98v271H249Z" fill="#627c68"/>
    <path d="m249 590 151-124 112 128 91-77 48 50v235H249Z" fill="#415c50"/>
    <path d="M249 642c93-45 157-30 215 4s114 39 187-5v161H249Z" fill="#d59b64"/>
    <path d="M249 700c97-40 159-25 227 11s112 32 175 2v89H249Z" fill="#c47d55"/>
    <path d="M249 772c97-37 177-20 259 8v20H249Z" fill="#7c654d" opacity=".8"/>
    <rect x="226" y="199" width="448" height="626" fill="none" stroke="#fff7e9" stroke-width="8" opacity=".85"/>
    <rect x="184" y="157" width="532" height="710" fill="none" stroke="#f0c991" stroke-width="5" opacity=".8"/>
  </g>
  <ellipse cx="690" cy="1105" rx="107" ry="23" fill="#776a57" opacity=".28"/>
  <path d="M638 1003h112l-12 100h-88z" fill="#9b6343"/>
  <path d="m638 1003 56 19 56-19" fill="#b77851"/>
  <path d="M694 1005V888" stroke="#506247" stroke-width="12" stroke-linecap="round"/>
  <path d="M691 955c-55 5-77-20-82-66 44 0 73 17 82 66Zm5-38c49-7 69-37 66-78-43 8-66 30-66 78Zm-7-73c-36-10-49-37-40-70 32 14 46 36 40 70Zm9-37c34-15 42-43 28-73-28 18-39 42-28 73Z" fill="#687a58"/>
  <path d="M676 1036h36" stroke="#d6a27a" stroke-width="7" stroke-linecap="round" opacity=".7"/>
  <text x="450" y="1220" text-anchor="middle" fill="#514536" font-family="Arial, sans-serif" font-size="23" letter-spacing="7">A FRAMED MOMENT</text>
  <path d="M355 1250h190" stroke="#9a7752" stroke-width="3"/>
</svg>
